<div class="main_heading">
  <span class="heading_span"><h1>JMR - Report Management</h1></span>
  <div class="head_right_div">
    <span class="switch_span" >
			<div class="t_state_btn_two" *ngIf=(Buttondisp) >
				<div class="floating_div_two" id="tgt_div"></div>
				<label>
          <input type="radio" id="PMCheck" name="swth" checked (change)="OnChangeStatus($event, 'jmrtotal')"/> 
					<span>Total Sale</span>
				</label> 
				<label>
					<input type="radio" id="ef" name="swth" (change)="OnChangeStatus($event, 'diswise')"/> 
					<span>E-Detail</span>
				</label>
			</div>
            </span>
      <span class="pop_btn_span">
        <a title="Download_Excel" (click)="GetExportJMRreports()" data-popup-open="popup-1"><i class="fas fa-file-excel"></i></a>
        <a title="Download_PDF" (click)="GetPDF()" data-popup-open="popup-1"><i class="fas fa-file-pdf"></i></a>
      </span>
  </div> 
</div>
<div class="mycard">	
  <div class="main_table_container">
      <div class="main_form_container">
          <div class="report_row">
            <div>
              <div>
                <div class="label_container">
                  <label>Select Year</label>
              </div>
              <div class="input_container">
                  <select class="form-control" ([ngModel])="selectedYear" (change)="onyearselect($event.target.value)" >
                    <option *ngFor="let year of years" [value]="year">{{ year }}</option> 
                  </select>
              </div>
              </div>
              </div>
              <div>
                  <div class="label_container">
                      <label>Select Month</label>
                  </div>
                  <div class="input_container">
                      <select class="form-control" name="selectedMonth" (change)="OnMonthChange($event)">
                          <option value="" selected>--Select--</option>
                          <option value="Jan">January</option>  
                          <option value="Feb">Feburary</option> 
                          <option value="Mar">March</option>  
                          <option value="Apr">April</option>
                          <option value="May">May</option>          
                          <option value="June">June</option>    
                          <option value="July">July</option> 
                          <option value="Aug">August</option>   
                          <option value="Sep">September</option>  
                          <option value="Oct">October</option>  
                          <option value="Nov">November</option>
                          <option value="Dec">December</option>
                      </select>
                  </div>
              </div>
              <div>
                <div class="label_container">
                    <label> Select Fortnight</label>
                </div>
                <div class="input_container">
                    <select class="form-control" name="selectedfortnight" (change)="OnFortChnage($event)">
                        <option value="" selected>--Select--</option>
                        <option value="Fortnight1">Fortnight1</option>
                        <option value="Fortnight2">Fortnight2</option>  
                    </select>
                </div>
            </div>
          </div>
      </div>   
      <div class="main_form_container">
          <div class="report_row">
              <div>
                  <table id="myTable2" *ngIf="columns.length >0 " class="table table-bordered table-striped table-sm">
                      <thead>
                        <tr>
                          <th (click)="sortCol('Sr. No.')">Sr. No.</th>
                          <th (click)="sortCol(column)" *ngFor="let column of columns | filter : filter">{{column}}
                          </th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr *ngFor="let row of ResponseList | orderBy: key: reverse | filter : filter 
                        | paginate: { itemsPerPage: items, currentPage: Page }, let i = index" 
                        class="divTableCell" data-toggle="modal" data-target="#updatePopup">
                        <td>{{i+1}}</td>
                          <td *ngFor="let column of columns | filter : filter">
                            {{row[column]}}
                          </td>
                        </tr>
                      </tbody>
                    </table>
              </div>
          </div>
      </div>
      <div class="main_form_container">
        <div class="report_row">
          <div class="StnSumryBox">
            <div>
              <button class="mybtn" (click)="OnSubmit()" *ngIf="isStationSubmitted">Submit</button>
            </div>
          </div>
        </div>
    </div>
    <div class="main_form_container">
      <div class="report_row">
        <div class="StnSumryBox">
          <div *ngIf="!isStationSubmitted" class="save_all_btn_div text-center">
            <span style="color:red;font-size:14pt;font-weight:bolder;">{{Msg}}</span>
          </div>
        </div>
      </div>
  </div>
  </div>
</div>
